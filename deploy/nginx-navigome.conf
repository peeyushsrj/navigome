# Navigome — nginx blocks (repo copy of what runs on the Pi)
#
# Inserted inside the stock /etc/nginx/sites-available/default server {} block
# (the default_server vhost for :80; the sanjayphotocopiers vhost is untouched).
# App : http://<pi>/navigome/
# API : same-origin proxy so the browser never needs CORS or a cross-origin token.

location /navigome/ {
    alias /var/www/navigome/;
    try_files $uri $uri/ /navigome/index.html;
}

# nginx has no .webmanifest in mime.types → serve the manifest with a MIME
# Chrome accepts (other hosts default to application/octet-stream, which is ignored).
location = /navigome/manifest.webmanifest {
    alias /var/www/navigome/manifest.webmanifest;
    default_type application/manifest+json;
}

# Auto-token endpoint: file lives OUTSIDE the webroot; never committed.
location = /navigome/token.json {
    alias /etc/navigome/token;
    default_type application/json;
    add_header Cache-Control "no-store";
}

location /vikunja-api/ {
    proxy_pass http://127.0.0.1:3456/;   # trailing slash strips the prefix
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
